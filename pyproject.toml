[project]
name = "setu"
version = "0.1.0"
description = "240-day Data Science -> GenAI -> Agentic AI curriculum, built one day at a time."
requires-python = "==3.12.*"
dependencies = [
    "python-dotenv==1.2.3",
]

[dependency-groups]
dev = [
    "ruff==0.16.4",
    "pytest==9.1.1",
    "ipykernel==7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/setu"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "days/*/lab"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
    "live: hits a real API or database - skipped by default, never run in CI",
    "slow: takes more than a few seconds",
]
